<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="time-and-calander.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic" rel="stylesheet" />
    <title>How To Create Mini Calendar</title>
    <script src="https://kit.fontawesome.com/632daf4394.js" crossorigin="anonymous"></script>
    <script src="time-and-calander.js" defer></script>
</head>
<body>
    <div class="main-section">
        <header>
            <h1>Mini <i class="fa-solid fa-calendar"></i> Calender with <i class="fa-solid fa-clock"></i> Time</h1>
        </header>
        <section class="together">
            <div class="calender">
                <div class="left">
                    <p id="date">01</p>
                    <p id="day">Sunday</p>
                </div>
                <div class="right">
                    <i class="fa-regular fa-calendar"></i>
                    <p id="month">January</p>
                    <p id="year">2025</p>
                </div>
            </div>
            <div class="clock-section">
                <p id="hours">00</p><p id="minutes">00</p><p id="seconds">00</p><p id="d-and-night"></p>
            </div>
        </section>
        
        
    </div>
    <!-- <div class="clock-section">
        <p style="color: white;">Hello</p>
    </div> -->
</body>
</html>
