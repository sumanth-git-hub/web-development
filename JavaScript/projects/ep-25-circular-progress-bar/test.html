<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic" rel="stylesheet" />
    <title>How To Make Circular Progress</title>
    <script src="https://kit.fontawesome.com/632daf4394.js" crossorigin="anonymous"></script>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins",'Courier New', Courier, monospace;
}
.container {
    background-image: linear-gradient(to right, #1d0000, #20205b);
    width: 100%;
    height: 100vh;
    align-items: center;
    display: flex;
    gap: 30px;
}
.circle {
    border: 1px solid black;
    position: relative;
    width: 30px;
    height: 30px;
    background-color: #fff;
    display: inline-block;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}
.question-section {
    margin-left: 10%;
    width: 100%;
    max-width: 450px;
}
.circle i {
    visibility: hidden;
    font-size: 30px;
    color: green;
}
.circle.tick-mark i{
    visibility: visible;
}
.question-button {
    display: flex;
    align-items: center;
    gap: 30px;
    width: 100%;
    max-width: 400px;
    padding: 10px 20px;
    border-radius: 10px;
    border: none;
    outline: none;
    cursor: pointer;
    font-size: 16px;
    margin-bottom: 10px;
}
.progress-bar-container {
    width: 100%;
}
.circle-section {
    width: 260px;
    height: 260px;
    background-color: #fff;
    border-radius: 50%;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: background-image 1s ease-in-out;
}
.circle-section::before {
    content: "";
    width: 210px;
    height: 210px;
    background-color: #20205b;
    border-radius: 50%;
    position: absolute;
}
.percentageValue {
    position: relative;
    font-size: 32px;
    font-weight: 600;
}
    </style>
</head>
<body>
    <main class="container">
            <div class="question-section">
                <button class="question-button"><span class="circle"><i class="fa-solid fa-circle-check"></i></span>Click to Increase the Count</button>
                <button class="question-button"><span class="circle"><i class="fa-solid fa-circle-check"></i></span>Click to Increase the Count</button>
                <button class="question-button"><span class="circle"><i class="fa-solid fa-circle-check"></i></span>Click to Increase the Count</button>
                <button class="question-button"><span class="circle"><i class="fa-solid fa-circle-check"></i></span>Click to Increase the Count</button>
            </div>
            <div class="progress-bar-container">
                <div class="circle-section">
                    <span class="percentageValue">0%</span>
                </div>
            </div>
    </main>
    <script>
        

        const questionsParent = document.querySelector(".question-section");
        const actionButtons = document.querySelectorAll(".question-button");
        let scoreCount = 0
        const percentageOnPage = document.querySelector(".percentageValue");
        let donutEndingValue = scoreCount / questionsParent.childElementCount * 100
        const donutElement = document.querySelector(".circle-section");
        let runningValue = 0;
        let speed = 20;


        actionButtons.forEach(ctaButton => {
            ctaButton.addEventListener("click", (e) => {
                console.log(e.target.children[0])
                e.target.children[0].classList.toggle("tick-mark");
                if(e.target.children[0].classList.contains("tick-mark")){
                    runForward();
                }
                else {
                    runBackwards();
                }
            })
        });

        function runForward() {
            scoreCount ++
            donutEndingValue = scoreCount / questionsParent.childElementCount * 100

            const runPercentage = setInterval(() => {
                runningValue++
                percentageOnPage.textContent = runningValue + "%";
                donutElement.style.backgroundImage = `conic-gradient(#6A5ACD ${runningValue * 3.6}deg, #DED7D7 0deg)`;
            }, speed);
            setTimeout(() => {
                    clearInterval(runPercentage);
                }, 500);
        }
        function runBackwards() {
            scoreCount --;
            donutEndingValue = scoreCount / questionsParent.childElementCount * 100
           
            const runPercentage = setInterval(() => {
                runningValue--;
                percentageOnPage.textContent = runningValue + "%";
                donutElement.style.backgroundImage = `conic-gradient(#6A5ACD ${runningValue * 3.6}deg, #DED7D7 0deg)`
            }, speed);
            setTimeout(() => {
                    clearInterval(runPercentage);
                }, 500);
        }

    </script>
</body>
</html>

font-weight: 600;
font-size: 1.25rem;
line-height: 1.75rem;
