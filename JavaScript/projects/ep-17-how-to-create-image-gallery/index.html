<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic" rel="stylesheet" />
    <title>How To Create Image Gallery</title>
    <script src="https://kit.fontawesome.com/632daf4394.js" crossorigin="anonymous"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <section class="headings">
        <h1>Car Carousel Slider <span><i class="fa-solid fa-sliders"></i></span></h1>
        <p>Using HTML, CSS & JavaScript</p>
    </section>
    <div class="gallery-wrap">
        <i class="fa-solid fa-square-caret-left"></i>
        <div class="gallery">
            <div>
                <span><img src="./img-gal/img-1.jpg" alt="car image"></span>
                <span><img src="./img-gal/img-2.jpg" alt="car image"></span>
                <span><img src="./img-gal/img-3.jpg" alt="car image"></span>
            </div>
            <div>
                <span><img src="./img-gal/img-4.jpg" alt="car image"></span>
                <span><img src="./img-gal/img-5.jpg" alt="car image"></span>
                <span><img src="./img-gal/img-6.jpg" alt="car image"></span>
            </div>
            <div>
                <span><img src="./img-gal/img-7.jpg" alt="car image"></span>
                <span><img src="./img-gal/img-8.jpg" alt="car image"></span>
                <span><img src="./img-gal/img-9.jpg" alt="car image"></span>
            </div>
        </div>
        <i class="fa-solid fa-square-caret-right"></i>
    </div>
    
</body>
</html>
