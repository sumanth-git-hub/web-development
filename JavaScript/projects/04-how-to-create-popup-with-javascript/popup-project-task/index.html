<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css?family=Courier+Prime:regular,italic,700,700italic" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Inika:regular,700" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How to Create Popup Using JavaScript</title>
    <script src="script.js" defer></script>
</head>
<body>
    <!-- <h2>How to create a Popup</h2> -->
<div class="news-letter-component"><button class="news-letter-button">Get Newsletter</button>
    <img src="./cursor-hand-click-line.png" class="hand-cursor">
</div>
<div class="popup-container">
    <section class="overlay"></section>
    <div class="popup">
        <div class="close-icon">&times;</div>
        <img src="popup-image.png" alt="popup image" class="popup-image">
        <div class="text-content">
        <h2>Don’t miss out.</h2>
        <p>Sign up for our newsletter to stay in the loop.</p>
        </div>
        <form action="thank-you.html">
        <div class="input-container">
            <div class="email-container">
                <input type="email" name="user-email" id="user-mail-id" placeholder="EMAIL ADDRESS" required><div class="subscribe-text"><button class="submit-button">SUBSCRIBE</button>
                </form>
            </div>
        </div>
        </div>
    </div>
</div>

</body>
</html>
