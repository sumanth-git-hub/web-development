<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css?family=Courier+Prime:regular,italic,700,700italic" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How to Create Popup Using JavaScript</title>
    <script src="script.js" defer></script>
</head>
<body>
    <button class="button">Open Popup</button>
    <section class="stop-bubbling">
        <!-- <div class="overlay"></div> -->
        <div class="popup">
            <span class="close-icon">&times;</span>
            <h2>Don’t miss out.</h2>
            <p>Sign up for our newsletter to stay in the loop.</p>
        </div>
    </section>
</body>
</html>
