<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic" rel="stylesheet" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>How To Make Text To Voice Converter Using JavaScript</title>
    <script src="https://kit.fontawesome.com/632daf4394.js" crossorigin="anonymous"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <main class="main-section">
        <h1>Text to <span>Voice &nbsp;&nbsp;<i class="fa-solid fa-volume-high"></i></span> Converter</h1>
        <textarea class="note-pad" contenteditable="plaintext-only" placeholder="Write or paste anything here!"></textarea>
        <div class="counter-section"><p>Characters:&nbsp;<span class="char-count">0</span></p> <p>Words:&nbsp;<span class="word-count">0</span></p></div>
        <div class="row">
            <select></select>
            <button class="voice-button"><i class="fa-solid fa-play"></i><span>&nbsp;&nbsp;Listen</span></button>
        </div>
    </main>
</body>
</html>
