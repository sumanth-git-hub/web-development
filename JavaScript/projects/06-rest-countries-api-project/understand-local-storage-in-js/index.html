<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Understand Local Storage in JavaScript</title>
    <script src="script.js" defer></script>
    <style>
        body {
            background-color: black;
            color: white;
        }
        .car-details {
            background-color: yellowgreen;
            color: black;
            width: 100%;
            max-width: 400px;
            padding: 10px;
            border-radius: 10px;
        }
        .car-details p {
            margin: 10px;
        }
    </style>
</head>
<body>
    <h1>Local Storage in JavaScript</h1>
    <div>
        <p><label>Enter Car Brand: </label><input type="text" class="car-brand-input"></p>
        <p><label>Enter Car Model: </label><input type="text" class="car-model-input"></p>
        <p><label>Enter Car Variant: </label><input type="text" class="car-variant-input"></p>
        <p><label>Registration No: </label><input type="text" class="car-reg-input"></p>
    </div>
    <p>The Entered Data Display below</p>
    <div class="car-details">
        <p>Car Brand: <span class="brand"></span></p>
        <p>Car Model: <span class="model"></span></p>
        <p>Car Variant: <span class="variant"></span></p>
        <p>Car Registration Number: <span class="reg-number"></span></p>
    </div>
</body>
</html>
