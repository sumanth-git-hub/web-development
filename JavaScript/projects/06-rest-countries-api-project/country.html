<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,regular,500,600,700,800,900,200italic,300italic,italic,500italic,600italic,700italic,800italic,900italic" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css" integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="counrty.css">
    <title>Individual Country Page</title>
    <script src="counrty.js" defer></script>
</head>
<body>
    <header class="header-container">
        <div class="header-content">
            <h1 class="title"><a href="/practice-tasks/12-rest-countries-api-project-part-1/index.html">Where in the world?</a></h1>
            <p class="theme-switch"><i class="fa-regular fa-moon"></i><span>&nbsp;&nbsp;Dark Mode</span></p>
            <!-- <input type="text" class="local-storage">
            <span class="display-text-content"></span> -->
        </div>
    </header>
    <main>
<section class="adjust-section">
    <span class="back-button" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i>&nbsp;&nbsp;Back</span>
    <div class="country-container">
        <img src="" alt="flag">   
        <div class="details-text">
            <h1 class="title-of-the-page">Iceland</h1>
            <div class="text-container">
                <p><b>Native Name: </b><span class="native-name"></span></p>
                <p><b>Population: </b><span class="country-population"></span></p>
                <p><b>Region: </b><span class="country-region"></span></p>
                <p><b>Sub Region: </b><span class="sub-region"></span></p>
                <p><b>Capital: </b><span class="country-capital"></span></p>
                <p class="middle-section"><b>Top Level Domain: </b><span class="top-level-domain"></span></p>
                <p><b>Currencies: </b><span class="currencies"></span></p>
                <p><b>Languages: </b><span class="languages"></span></p>
            </div>
            <div class="border-countries-section">
                <b>Border Countries: </b>
                <!-- <span class="child-country"><a href="#">Israel</a><a href="#">USA</a><a href="#">UAE</a></span> -->
            </div>
        </div>
    </div>
</section>
    </main>
</body>
</html>
