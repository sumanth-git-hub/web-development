<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="javascript-project.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Completed JavaSCript First Project</title>
    <script src="javascript-project.js" defer></script>
</head>

<body>
    <main class="main-tag">
        <h1 class="heading-text">Focus on <span>Today</span></h1>
        <div class="container">
            <h2 class="sub-heading">Today <img alt="sun image" src="./Sun.svg" class="sun-vector-art"></h2>
            <!-- <p class="paragraph-1">Raise the bar by completing your goals!</p> -->
            <p class="progress-label">Raise the bar by completing your goals!</p>
            <!-- <p class="paragraph-5">Just a step away, keep going!</p> -->
            <div class="progress-bar-container">
                <div class="progress-pie"><span></span></div>
                <p class="paragraph-2">Please set all the 3 goals!</p>
            </div>
            <div class="goal-container">
                <div class="check-circle"><img src="./check-icon.svg" alt="check-icon"></div><input id="first-input"
                    class="name-input" type="text" placeholder="Add new goal... ">
            </div>
            <div class="goal-container">
                <div class="check-circle"><img src="./check-icon.svg" alt="check-icon"></div><input id="second-input"
                    class="name-input" type="text" placeholder="Add new goal... ">
            </div>
            <div class="goal-container">
                <div class="check-circle"><img src="./check-icon.svg" alt="check-icon"></div><input id="third-input"
                    class="name-input" type="text" placeholder="Add new goal... ">
            </div>
            <div class="goal-container">
                <div class="check-circle"><img src="./check-icon.svg" alt="check-icon"></div><input id="fourth-input"
                    class="name-input" type="text" placeholder="Add new goal... ">
            </div>
            <div class="goal-container">
                <div class="check-circle"><img src="./check-icon.svg" alt="check-icon"></div><input id="fifth-input"
                    class="name-input" type="text" placeholder="Add new goal... ">
            </div>
            <p class="paragraph-3">“Move one step ahead, today!”</p>
            <p class="paragraph-6">“Keep Going, You’re making great progress!”</p>
            <p class="paragraph-4">Made with ❤️ by Sumanth</p>
        </div>
    </main>

    <div class="source-tab">

       </div>
</body>

</html>
