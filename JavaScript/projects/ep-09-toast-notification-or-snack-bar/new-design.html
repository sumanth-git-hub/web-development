<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic" rel="stylesheet" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="new-style.css">
    <title>Toast Notification or Snack Bar</title>
    <script src="new-script.js" defer></script>
    <script src="https://kit.fontawesome.com/632daf4394.js" crossorigin="anonymous"></script>
</head>
<body>
    <main>
        <h1><span>Toast</span><br>Notifications<br></h1>
        <div class="buttons">
            <button onclick="callButtons(successMsg)">Success</button>
            <button onclick="callButtons(errorMsg)">Error</button>
            <button onclick="callButtons(invalidMsg)">Invalid</button>
        </div>
        <div id="toast-box">

        </div>
    </main>
</body>
</html>
