<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="hamburger-menu.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link
        href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic"
        rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie Hamburger Project</title>
    <script src="hamburger-menu.js" defer></script>
</head>

<body>
    <section class="for-mobile-response">
        <header>
            <div class="header-content">
                <div class="logo-container">
                    <a href="https://www.figma.com/design/pGRft10V0mLb5Rz3l1kFDz/Foodie-Hamburger" target="_blank"><img src="./images/foodie-hamburger-logo.png" alt="foodie-hamburger-logo"></a>
                </div>
                <nav class="stop-bubbling">
                    <div class="hamburger-menu-icon-container">
                        <div class="circle">
                            <div class="hamburger-menu-icon">
                                <span>&#9776;</span>
                            </div>
                        </div>
                    </div>
                    <ul class="navigation-links">
                        <span class="close-icon">&times;</span>
                        <li><a href="#top-pics">Top Picks</a></li>
                        <li><a href="#whopper">Whopper</a></li>
                        <li><a href="#stunner-menu">Stunner Menu</a></li>
                        <li><a href="#new-foodie-collection">New Foodie Collection</a></li>
                        <li><a href="#deal-of-the-day">Deal of the Day</a></li>
                    </ul>
                </nav>
            </div>
        </header>
        <main>
            <section class="hero-section">
                <div class="image-container"><img src="./images/hero-image.png" alt="burger-menu"></div>
                <p>Well, You can’t resist anymore!</p>
            </section>
            <section class="section" id="top-pics">
                <h2>Top Picks</h2>
                <div class="image-container"><img src="./images/top-pics.png" alt="top-pics-burger"></div>
            </section>
            <section class="section" id="whopper">
                <h2>Whopper</h2>
                <div class="image-container"><img src="./images/whopper.png" alt="whopper"></div>
            </section>
            <section class="section" id="stunner-menu">
                <h2>Stunner Menu</h2>
                <div class="image-container"><img src="./images/stunner-menu.png" alt="stunner-menu"></div>
            </section>
            <section class="section" id="new-foodie-collection">
                <h2>New Foodie Collection</h2>
                <div class="image-container"><img src="./images/new-foodie-collection.png" alt="new-foodie-collection">
                </div>
            </section>
            <section class="section" id="deal-of-the-day">
                <h2>Deal of the Day</h2>
                <div class="image-container"><img src="./images/deal-of-the-day.png" alt="deal-of-the-day"></div>
            </section>
        </main>
        <footer>
            <h3 class="navigate-top"><a href="#">Go to Top</a></h3>
            <p class="author-words">Authored with ❤️ by Sumanth Hindu</p>
        </footer>
    </section>
</body>

</html>
