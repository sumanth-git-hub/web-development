<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How to make a Form Validation</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic" rel="stylesheet" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <script src="https://kit.fontawesome.com/632daf4394.js" crossorigin="anonymous"></script>
    <script src="script.js" defer></script>
</head>
<body>
  <div class="container">
    <div class="heading-section">
      <h1>Form <span>Validation</span></h1>
      <p>Using JavaScript</p>
    </div>
    
    <div class="first-section">
      <button id="open-modal">Open Form</button>
    </div>
    <form  class="new-form"> 
      <i class="fas fa-paper-plane"></i>
      
       <div class="close-sec">
        <i class="fa-solid fa-xmark"></i>
       </div>
     
      <div class="input-group">
        <label for="user-name">Full Name</label>
        <input type="text" placeholder="Enter your name" id="user-name" onkeyup="validateName()">
        <span id="name-error"></span>
      </div>

      <div class="input-group">
        <label for="user-contact-number">Phone No.</label>
        <input type="tel" placeholder="123 456 7890" id="user-contact-number" onkeyup="validateNumber()">
        <span id="phone-error"></span>
      </div>

      <div class="input-group">
        <label for="user-email-id">Email Id</label>
        <input type="email" placeholder="Enter Email" id="user-email-id" onkeyup="validateEmail()">
        <span id="email-error"></span>
      </div>   

      <div class="input-group">
        <label for="validate-message">Your Message</label>
        <textarea rows="5" placeholder="Enter your message" id="validate-message" onkeyup="validateUserContent()"></textarea>
        <span id="message-error"></span>
      </div>

    <button id="submit-button" type="submit" onclick="return validateForm()">Submit</button>
    <span id="submit-error"></span>
   
  </form>

  </div>
  <section>
    
  </section>
</body>
</html>
