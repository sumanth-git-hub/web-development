<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="new-style.css">
    <link href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Generate QR Code in One Click</title>
    <script src="new-script.js" defer></script>
</head>
<body>
<main class="main-container">
    <h1>Generate QR Code<br>
        <span>in Just One Click&nbsp;&nbsp;&nbsp;<i class="fa-regular fa-hand-pointer"></i></span></h1>
    <div class="container">
        <p>Enter your text or URL</p>
        <input type="text" placeholder="Text or URL" id="qr-text">
        <div id="qr-image-box">
            <img src="" id="qr-code-image">
        </div>
        <button class="generate-qr-button">Generate QR Code</button>
    </div>
</main>
</body>
</html>
