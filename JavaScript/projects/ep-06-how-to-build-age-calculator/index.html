<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic" rel="stylesheet" />
    <title>Age Calculator</title>
    <!-- <script src="script.js" defer></script> -->
     <script src="practice-script.js" defer></script>
</head>
<body>
    <main class="container">
        <div class="calculator">
            <h1>JavaScript <br><span class="">Age Calculator</span></h1>
            <div class="input-box">
                <input type="date" id="date">
                <button class="calculate-age-button">Calculate</button>
            </div>
            <p id="results">Enter the Date of birth to calculate the age</p>
            <p id="new-results">Enter the Date of birth to calculate the age<span class="year"></span>, <span class="month"></span><span class="days"></span></p>
        </div>
    </main>
</body>
</html>
