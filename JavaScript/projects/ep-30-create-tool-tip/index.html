<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,regular,500,600,700,800,900,200italic,300italic,italic,500italic,600italic,700italic,800italic,900italic" rel="stylesheet" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>How To Make Tooltips</title>
    <script src="script.js" defer></script>
</head>
<body>
    
    <main>
        <h1>Create Tooltip for <span class="auto-type-element"></span></h1>
        <div class="tool-tip-container">
            <div class="tool-tip-icon mango-db">
                <img src="./icons/mongodb.svg" alt="mongodb">
                <span>M</span>
                <div class="tool-tip"><span>MangoDB</span></div>
            </div>
            <div class="tool-tip-icon express-js">
                <img src="./icons/expressjs.svg" alt="expressjs">
                <span>E</span>
                <div class="tool-tip"><span>Express.JS</span></div>
            </div>
            <div class="tool-tip-icon react-js">
                <img src="./icons/reactjs.svg" alt="reactjs">
                <span>R</span>
                <div class="tool-tip"><span>React.JS</span></div>
            </div>
            <div class="tool-tip-icon nodejs">
                <img src="./icons/nodejs.svg" alt="nodejs">
                <span>N</span>
                <div class="tool-tip"><span>Node.JS</span></div>
            </div>
        </div>
    </main>
    

    <main>
        <h1>Create Tooltip for <span class="auto-type-element-next"></span></h1>
        <div class="tool-tip-container">
            <div class="tool-tip-icon mango-db">
                <img src="./icons/mongodb.svg" alt="mongodb">
                <span>M</span>
                <div class="tool-tip"><span>MangoDB</span></div>
            </div>
            <div class="tool-tip-icon express-js">
                <img src="./icons/expressjs.svg" alt="expressjs">
                <span>E</span>
                <div class="tool-tip"><span>Express.JS</span></div>
            </div>
            <div class="tool-tip-icon angular-js">
                <img src="./icons/angular-js.png" alt="angular-js">
                <span>A</span>
                <div class="tool-tip"><span>Angular.JS</span></div>
            </div>
            <div class="tool-tip-icon nodejs">
                <img src="./icons/nodejs.svg" alt="nodejs">
                <span>N</span>
                <div class="tool-tip"><span>Node.JS</span></div>
            </div>
        </div>
    </main>
</body>
</html>
