<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic" rel="stylesheet" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>How To Make Select Menu Design</title>
    <script src="https://kit.fontawesome.com/632daf4394.js" crossorigin="anonymous"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Drop Down Menu Selector <i class="fa-regular fa-square-caret-down"></i></h1>
    </header>
    <div class="container">
        <div class="selector">
            <div class="select-field">
                <p class="select-text">Choose Car Brand</p>
                <i class="fa-solid fa-angle-down"></i>
            </div>

            <ul id="list-of-brands" class="hide-list">
                <li class="car-brands">
                    <img src="./car-brand-logos/volkswagen.png" alt="volkswagen">
                    <p>Volkswagen</p>
                </li>
                <li class="car-brands">
                    <img src="./car-brand-logos/bmw-logo.png" alt="bmw">
                    <p>BMW</p>
                </li>
                <li class="car-brands">
                    <img src="./car-brand-logos/toyota.png" alt="toyota">
                    <p>Toyota</p>
                </li>
                <li class="car-brands">
                    <img src="./car-brand-logos/audi-logo.png" alt="audi">
                    <p>Audi</p>
                </li>
                <li class="car-brands">
                    <img src="./car-brand-logos/mercedes-benz.png" alt="mercedes">
                    <p>Mercedes</p>
                </li>
                
            </ul>

        </div>
    </div>
</body>
</html>
