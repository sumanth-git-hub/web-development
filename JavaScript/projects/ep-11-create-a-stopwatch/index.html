<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Courier+Prime:regular,italic,700,700italic" rel="stylesheet" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>How to create a Stopwatch?</title>
    <script src="script.js" defer></script>
    <script src="https://kit.fontawesome.com/632daf4394.js" crossorigin="anonymous"></script>
</head>
<body>
    <main class="stop-watch">
        <h1 id="display-time">00:00:00</h1>
        <div class="buttons">
            <img src="./images/stop.png" onclick="watchStop()" alt="stop">
            <img src="./images/start.png" onclick="watchStart()" alt="start">
            <img src="./images/reset.png" onclick="watchReset()" alt="reset">
        </div>
    </main>
</body>
</html>
