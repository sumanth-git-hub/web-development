    <h1>Spread Operator In JavaScript</h2>
    <p>The <code>spread operator</code> is a feature of JavaScript introduced with ES6 that gives you access to the insides of an iterable object. An “iterable object” is anything you can iterate over item by item, such as arrays, objects literals, and strings.</p>
