<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Project with Area</title>
</head>
    <style>
        h1 {
            text-align: center;
            font-size: 40px;
        }
        .container {
            display: grid;
            /* grid-template-columns: repeat(2, 1fr); */
            grid-template-areas: 
                'purple purple'
                'green blue'
                'yellow blue'
                'orange orange'
            ;
            padding: 20px;
            gap: 20px;
            margin-inline: 54px;
        }
        .box {
            min-height: 300px;
            font-size: 4rem;
            padding: 1rem;
            color: white;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box-1 {
            background-color: rgb(125, 18, 226);
            /* grid-column: 2 span; */
            grid-area: purple;
        }
        .box-2 {
            background-color: rgb(12, 213, 35);
            grid-area: green;
        }
        .box-3 {
            background-color: rgb(71, 6, 97);
            /* grid-row: 2 span; */
            grid-area: blue;
        }
        .box-4 {
            background-color: rgb(219, 222, 45);
            grid-area: yellow;
        }
        .box-5 {
            background-color: rgb(190, 64, 29);
            /* grid-column: 2 span; */
            grid-area: orange;
        }
        @media screen and (max-width: 500px) {
                .container {
                    grid-template-areas: 
                    'purple'
                    'green'
                    'blue'
                    'yellow'
                    'orange';
                    margin-inline: 1rem;
                    padding: 5px;
                }
                 .box {
                    min-height: 200px;
                    border-radius: 20px;
                    grid-column: 2 span;
                 }
                 .box-3 {
                    

                    grid-row-start: 3;
                    grid-row-end: 4;
                 }
        }
        @media screen and (min-width: 840px) {
            .container {
                    /* grid-template-columns: repeat(4, 1fr); */
                    grid-template-areas: 
                    'purple purple green blue'
                    'yellow orange orange blue'
                      ;
                    margin-inline: 1rem;
                    padding: 5px;

                }  
        }
    </style>
    <body>
            <h1>CSS Grid</h1>
        <div class="container">
            <div class="box box-1">1</div>
            <div class="box box-2">2</div>
            <div class="box box-3">3</div>
            <div class="box box-4">4</div>
            <div class="box box-5">5</div>
        </div>
    </body>
</html>
